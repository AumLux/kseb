name: Supabase

on:
  pull_request:
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  push:
    # revamp/** is covered by its pull request; running on both doubled the minutes.
    branches: [staging, releases]
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  schedule:
    - cron: "30 20 * * *" # 02:00 IST nightly backup + keep-alive
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-${{ github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start database (applies migrations + seed)
        run: supabase db start
      - name: Lint database functions
        run: supabase db lint --level warning --fail-on warning
      - name: Security & workflow tests (pgTAP)
        run: supabase test db

  deploy:
    needs: test
    if: github.event_name == 'push' && (github.ref_name == 'staging' || github.ref_name == 'releases')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'releases' && 'production' || 'staging' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ github.ref_name == 'releases' && 'zjgqpyiceqofubjbevtv' || 'dtficnziewtaplbqoofn' }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Set SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD in the '${{ github.ref_name == 'releases' && 'production' || 'staging' }}' environment."
            exit 1
          fi
      - run: supabase link --project-ref "$PROJECT_REF"
      - name: Apply migrations
        # Sample org/catalogue seed goes to staging only; production starts empty.
        run: supabase db push ${{ github.ref_name == 'staging' && '--include-seed' || '' }}
      - name: Deploy edge functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"

  backup:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Keep projects awake (free tier pauses after 7 idle days)
        run: |
          curl -fsS -o /dev/null "https://zjgqpyiceqofubjbevtv.supabase.co/rest/v1/" -H "apikey: sb_publishable_1X82dDKVwf-keni6ovFN6w_o0P8Nrtj" || true
          curl -fsS -o /dev/null "https://dtficnziewtaplbqoofn.supabase.co/rest/v1/" -H "apikey: sb_publishable_xP-FAW8BjMAGpWbjhBXc6Q_guDcWn1q" || true
      - name: Dump production
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.BACKUP_PASSPHRASE != ''
        run: |
          set -euo pipefail
          supabase link --project-ref zjgqpyiceqofubjbevtv
          stamp=$(date -u +%Y%m%dT%H%MZ)
          mkdir backup
          supabase db dump -f backup/roles.sql --role-only
          supabase db dump -f backup/schema.sql
          supabase db dump -f backup/data.sql --use-copy --data-only
          tar czf "aumlux-$stamp.tgz" backup
          # Public repo: artifacts are downloadable by any signed-in GitHub user,
          # so the dump is always encrypted before upload.
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
              --symmetric --cipher-algo AES256 -o "aumlux-$stamp.tgz.gpg" "aumlux-$stamp.tgz"
          rm -rf backup "aumlux-$stamp.tgz"
          echo "BACKUP_FILE=aumlux-$stamp.tgz.gpg" >> "$GITHUB_ENV"
      - name: Upload encrypted backup
        if: env.BACKUP_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
