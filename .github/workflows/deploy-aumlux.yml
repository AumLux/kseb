name: Aumlux Release Cycle

on:
  push:
    branches:
      - staging
      - releases
  pull_request:
    branches:
      - staging
      - releases
      - "revamp/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: aumlux-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'releases' }}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Dart packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # Every push to staging builds BOTH variants from the same commit: the
  # staging site (tested against the staging project) and the production site
  # (production project, release-signed). `releases` later promotes exactly
  # that production artifact, so what ships is what was tested.
  build-staging:
    if: github.event_name == 'push' && github.ref_name == 'staging'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Dart packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; the production build will be refused."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aumlux-release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/aumlux-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build staging site
        run: tools/ci/build-site.sh staging site-staging

      - name: Build production site
        run: tools/ci/build-site.sh production site-production

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/aumlux-release.jks"

      - name: Upload staging build
        uses: actions/upload-artifact@v4
        with:
          name: aumlux-staging-${{ github.sha }}
          path: site-staging
          retention-days: 14

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: aumlux-production-${{ github.sha }}
          path: site-production
          retention-days: 30

  deploy-release:
    if: github.event_name == 'push' && github.ref_name == 'releases'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Download the production build of the latest staging run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list             --repo "$GITHUB_REPOSITORY"             --workflow "deploy-aumlux.yml"             --branch staging             --event push             --status success             --limit 1             --json databaseId             --jq '.[0].databaseId')"
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful staging build found."
            exit 1
          fi

          ARTIFACT_NAME="$(gh api             "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts"             --jq '.artifacts[] | select(.expired == false) | select(.name | startswith("aumlux-production-")) | .name'             | head -n 1)"
          if [ -z "$ARTIFACT_NAME" ]; then
            echo "No non-expired production artifact found for run $RUN_ID."
            exit 1
          fi

          mkdir -p build/web
          gh run download "$RUN_ID"             --repo "$GITHUB_REPOSITORY"             --name "$ARTIFACT_NAME"             --dir build/web

          echo "Promoting $ARTIFACT_NAME from run $RUN_ID"
          test -s build/web/index.html
          test -s build/web/downloads/aumlux.apk
          grep -qx "environment=production" build/web/release-metadata.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: aumlux-pages
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: aumlux-pages
