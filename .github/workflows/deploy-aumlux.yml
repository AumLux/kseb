name: Deploy Aumlux

# staging  → test + build web + build APK in parallel → publish the customer
#            preview at https://aumlux.simplewebsite.in (landing page, live
#            web app, APK download) and a rolling "preview" GitHub release.
# releases → release-signed production APK + web bundle as a versioned
#            GitHub release (production never auto-deploys over the preview).
# PRs      → analyze + test only.
on:
  push:
    branches: [staging, releases]
    paths-ignore: ["docs/**", "**/*.md", "supabase/**"]
  pull_request:
    branches: [staging, releases, "revamp/**"]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
    inputs:
      web_only:
        description: "Skip the APK build and reuse the last preview APK (web-only fixes, ~2 min)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: aumlux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'releases' }}

env:
  # Pinned to the version the team builds with locally: an unpinned "stable"
  # drifted ahead and required a newer Gradle than the project uses.
  FLUTTER_VERSION: "3.44.2"
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter=github

  web:
    name: Build web
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build
        run: >
          flutter build web --release --no-pub --base-href /web/
          --build-number=$((1000 + BUILD_NUMBER))
          --dart-define=AUMLUX_ENV=${{ github.ref_name == 'releases' && 'production' || 'staging' }}
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web
          retention-days: 7

  apk:
    name: Build APK
    if: github.event_name != 'pull_request' && !inputs.web_only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # Caches dependencies, wrapper and the Gradle build cache (task outputs).
      # Only staging writes the cache; other refs read it.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref_name != 'staging' }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$GITHUB_REF_NAME" = "releases" ]; then
              echo "::error::Production needs the ANDROID_KEYSTORE_* secrets."; exit 1
            fi
            echo "::warning::No release key configured; the preview APK is debug-signed."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aumlux-release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/aumlux-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      # arm64 only: every supported phone is 64-bit, and it is ~3x smaller
      # than a universal APK, so the customer download is quick.
      - name: Build
        run: >
          flutter build apk --release --no-pub --target-platform android-arm64
          --build-number=$((1000 + BUILD_NUMBER))
          --dart-define=AUMLUX_ENV=${{ github.ref_name == 'releases' && 'production' || 'staging' }}
      - name: Verify
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          unzip -tq "$APK"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BT/apksigner" verify --print-certs "$APK" | tee certs.txt
          if [ "$GITHUB_REF_NAME" = "releases" ] && grep -q "CN=Android Debug" certs.txt; then
            echo "::error::Production APK is debug-signed."; exit 1
          fi
          echo "### APK: $(du -h "$APK" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/aumlux-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  preview:
    name: Publish preview site
    if: >-
      !cancelled() && github.event_name != 'pull_request' && github.ref_name != 'releases' &&
      needs.test.result == 'success' && needs.web.result == 'success' &&
      (needs.apk.result == 'success' || (inputs.web_only && needs.apk.result == 'skipped'))
    needs: [test, web, apk]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://aumlux.simplewebsite.in
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Reuse the last preview APK (web-only run)
        if: inputs.web_only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/apk
          gh release download preview --repo "$GITHUB_REPOSITORY" -p aumlux.apk -O artifacts/apk/app-release.apk
      - name: Assemble site
        run: |
          sudo apt-get install -y -qq qrencode >/dev/null
          BUILD_NUMBER=$((1000 + BUILD_NUMBER)) bash tools/ci/assemble-site.sh staging artifacts/web artifacts/apk/app-release.apk site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Update the rolling "preview" release (download mirror)
        if: ${{ !inputs.web_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp artifacts/apk/app-release.apk aumlux.apk
          NOTES="Preview build $((1000 + BUILD_NUMBER)) from ${GITHUB_SHA:0:7}. Web: https://aumlux.simplewebsite.in"
          if gh release view preview >/dev/null 2>&1; then
            gh release upload preview aumlux.apk --clobber
            gh release edit preview --notes "$NOTES" --target "$GITHUB_SHA"
          else
            gh release create preview aumlux.apk --prerelease --title "Preview (staging)" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
      - name: Smoke-test the live site
        run: |
          sleep 20
          curl -fsS https://aumlux.simplewebsite.in/version.json
          curl -fsSI https://aumlux.simplewebsite.in/web/ | head -1

  release:
    name: Production release
    if: github.event_name == 'push' && github.ref_name == 'releases'
    needs: [test, web, apk]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//; s/+.*//')"
          TAG="v${VERSION}+$((1000 + BUILD_NUMBER))"
          cp artifacts/apk/app-release.apk "aumlux-${VERSION}.apk"
          (cd artifacts/web && zip -qr "../../aumlux-web-${VERSION}.zip" .)
          gh release create "$TAG" "aumlux-${VERSION}.apk" "aumlux-web-${VERSION}.zip" \
            --title "AumLux $VERSION" --generate-notes --target "$GITHUB_SHA"
